[package]
name = "libtock_gpio"
version = "0.1.0"
authors = ["Tock Project Developers <tock-dev@googlegroups.com>"]
license = "Apache-2.0 OR MIT"
edition = "2018"
repository = "https://www.github.com/tock/libtock-rs"
rust-version.workspace = true
description = "libtock gpio driver"

[features]
rust_embedded = ["embedded-hal"]

# Adds `Future`-returning APIs alongside the blocking ones. Off by default so
# apps that only poll pins link no waker machinery.
async = ["libtock_platform/async"]

[dependencies]
libtock_platform = { path = "../../../platform" }
embedded-hal = { version = "1.0", optional = true }

[dev-dependencies]
libtock_unittest = { path = "../../../unittest" }
